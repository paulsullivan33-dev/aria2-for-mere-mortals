site_name: aria2 for Mere Mortals
site_description: Downloading files from the command line with one tool for HTTP, FTP, BitTorrent and Metalink. Fetching several files at once, splitting one file across connections, resuming what stopped, checking hashes, working through a list of addresses, and driving it all from another program, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/aria2-for-mere-mortals/
